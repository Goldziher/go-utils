
version = "5.0"
name = 'go-utils'
description = 'A comprehensive Go utility library providing collection manipulation functions inspired by JavaScript and Python, leveraging Go 1.18+ generics for type-safe operations on slices, maps, structs, dates, strings, and URLs with utilities like filter, map, reduce, merge, flatten, and query string builders.'
gitignore = true
gitignore_exclude = [
  ".claude/agents/code-reviewer.md",
  ".claude/agents/docs-writer.md",
  ".claude/agents/security-auditor.md",
  ".claude/agents/test-writer.md",
  ".claude/skills/development-workflow/SKILL.md",
  ".claude/skills/iterate/SKILL.md",
  ".claude/skills/parallelize/SKILL.md",
  ".claude/skills/project-architecture/SKILL.md",
  ".claude/skills/usage-patterns-and-examples/SKILL.md",
  "AGENTS.md",
  "CLAUDE.md",
]
default_layers = ["plugins"]
presets = ["claude", "codex", "opencode", "pi"]
builtins = ['go', 'default-commands']

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false
